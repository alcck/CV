<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Almina Gökçe Çiçek - CV</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-bg: #eaf4ed;
            --panel-bg: rgba(255, 255, 255, 0.88);
            --accent-color: #23533d;
            --accent-secondary: #3b7a57; 
            --text-color: #12281d;
            --sub-text-color: #31503c;
            --body-text: #22382c;
        }

        body {
            background-color: var(--primary-bg);
            background-image: linear-gradient(rgba(234, 244, 237, 0.7), rgba(210, 235, 218, 0.8)), url('https://images.unsplash.com/photo-1542601906990-b4d3fb778b09?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--body-text);
            font-family: 'Quicksand', sans-serif;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
        }

        .cv-container {
            background-color: var(--panel-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.95);
            box-shadow: 0 20px 40px rgba(35, 83, 61, 0.15), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.95);
            width: 100%;
            max-width: 920px;
            padding: 3rem;
            border-radius: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 2.5rem;
            position: relative;
        }

        .lang-btn {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            background: var(--accent-color);
            color: white;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.4rem 0.8rem;
            border-radius: 9999px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: all 0.2s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .lang-btn:hover {
            background: #12281d;
            transform: translateY(-1px);
        }

        .section-header {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--accent-color);
            border-bottom: 2px solid rgba(35, 83, 61, 0.25);
            padding-bottom: 0.4rem;
            margin-bottom: 1.2rem;
            letter-spacing: -0.01em;
        }

        .item-title {
            color: var(--accent-color);
            font-weight: 700;
            font-size: 1.05rem;
        }
        
        .item-subtitle {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--sub-text-color);
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.6rem;
            font-size: 0.9rem;
            transition: transform 0.2s ease;
        }

        .contact-item:hover {
            transform: translateX(4px);
        }

        .contact-item a, .contact-item span {
            color: var(--body-text);
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .contact-item a:hover {
            color: var(--accent-color);
        }

        .skill-badge {
            background: linear-gradient(135deg, rgba(59, 122, 87, 0.12), rgba(35, 83, 61, 0.08));
            border: 1px solid rgba(59, 122, 87, 0.35);
            padding: 0.3rem 0.75rem;
            border-radius: 1rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--accent-color);
            display: inline-block;
            margin: 0.25rem;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.03);
            transition: all 0.2s ease;
        }

        .skill-badge:hover {
            background: linear-gradient(135deg, rgba(59, 122, 87, 0.25), rgba(35, 83, 61, 0.15));
            border-color: var(--accent-color);
            transform: translateY(-1px);
        }

        @media (min-width: 768px) {
            .cv-container {
                flex-direction: row;
            }
            .sidebar {
                flex: 1;
                border-right: 1px solid rgba(35, 83, 61, 0.2);
                padding-right: 2.2rem;
            }
            .main-content {
                flex: 1.85;
                padding-left: 2.2rem;
            }
        }
    </style>
</head>
<body>

<div class="cv-container">
    <!-- TR Language Button -->
