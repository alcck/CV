<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Almina Gökçe Çiçek - CV</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #050d08;
            --secondary-color: #08160f;
            --accent-color: #00ff66; /* Neon green */
            --text-color: #c0ded0; /* Light greenish-grey */
            --sub-text-color: #7b9e8b;
        }

        body {
            background-color: var(--primary-color);
            background-image: linear-gradient(rgba(5, 13, 8, 0.85), rgba(5, 13, 8, 0.85)), url('https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-color);
            font-family: 'Fira Code', monospace;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
        }

        .cv-container {
            background-color: rgba(8, 22, 15, 0.92);
            backdrop-filter: blur(10px);
            border: 2px solid var(--accent-color);
            box-shadow: 0 0 25px rgba(0, 255, 102, 0.3);
            width: 100%;
            max-width: 850px;
            padding: 2.5rem;
            border-radius: 1rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            position: relative;
        }
        
        .cv-container:before {
            content: '';
            position: absolute;
            top: -5px;
            left: -5px;
            right: -5px;
            bottom: -5px;
            background: linear-gradient(45deg, var(--accent-color), transparent);
            filter: blur(10px);
            opacity: 0.4;
            z-index: -1;
            pointer-events: none;
        }

        .section-header {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent-color);
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 0.5rem;
            margin-bottom: 1.5rem;
            text-shadow: 0 0 8px var(--accent-color);
        }

        .item-title {
            color: var(--accent-color);
            font-weight: 600;
        }
        
        .item-subtitle {
            font-weight: 400;
            font-size: 0.9rem;
            color: var(--sub-text-color);
        }
        
        .list-item {
            display: flex;
            align-items: flex-start;
            gap: 1rem;
            margin-bottom: 0.75rem;
        }
        
        .list-item svg {
            color: var(--accent-color);
            flex-shrink: 0;
            margin-top: 0.25rem;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.5rem;
        }

        .contact-item a {
            color: var(--text-color);
            transition: color 0.3s ease;
        }

        .contact-item a:hover {
            color: var(--accent-color);
            text-shadow: 0 0 5px var(--accent-color);
        }
